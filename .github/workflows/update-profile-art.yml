name: Update profile art

# Refreshes the contribution graph, stats card, and avatar portrait daily.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}
      GH_PROFILE_NAME: Manvendra Singh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Fetch GitHub avatar
        run: python scripts/fetch_avatar.py

      - name: Render ASCII portrait
        run: python scripts/make_ascii_svg.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py "$GH_PROFILE_USER" contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg ascii-portrait.svg"
